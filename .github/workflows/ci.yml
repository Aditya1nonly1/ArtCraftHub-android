# Adapted from ProCraft's .github/workflows/ci.yml (https://github.com/artcraft-android/procraft,
# MIT License): the Rust checks, the Android build and the 16 KB page check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.100.0"
  NDK_VERSION: "27.2.12479018"

jobs:
  rust:
    name: Rust (format, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  android:
    name: Android (clippy, unit tests, APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: NDK
        run: |
          yes | sdkmanager --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Clippy for Android
        run: cargo ndk -t arm64-v8a --platform 26 clippy -p hub-core --lib -- -D warnings
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: 16 KB pages
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          dir=$(mktemp -d)
          unzip -q "$apk" 'lib/*/libhub_core.so' -d "$dir"
          for so in "$dir"/lib/*/*.so; do
            for align in $("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((align)) -lt 16384 ]; then
                echo "$so: a segment aligned to $align"
                exit 1
              fi
            done
          done
          echo "libhub_core.so is aligned to 16 KB for every ABI"

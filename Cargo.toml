[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Never crash on input: no unwrap/expect/panics/indexing outside tests (see clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "warn"

# No `strip` here: uniffi-bindgen reads metadata symbols from the .so; the Android Gradle plugin
# strips the library when it packages the APK. Unwinding (no `panic = "abort"`) lets UniFFI turn a
# stray panic into a Kotlin exception instead of killing the app.
[profile.release]
lto = "fat"
codegen-units = 1

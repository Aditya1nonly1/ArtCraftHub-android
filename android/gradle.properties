org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Rust library's ABIs: arm64-v8a for phones, x86_64 for the emulator (armeabi-v7a for old
# 32-bit phones is built on its own for a release). Build one to save time, e.g.
# `./gradlew installDebug -Phub.abis=arm64-v8a`.
hub.abis=arm64-v8a,x86_64

# The app's version and its version code (before the ABI digit: see app/build.gradle.kts, the build
# checks the two agree). A release tag v<version> must name this version.
hub.version=0.1.0
hub.versionCode=10099
